
# Alt+z: Toggle vertical maximize/restore for the current pane
# If layout is saved, restore it; otherwise save current layout and maximize vertically
bind -n M-z if -F '#{@layout_save}' \
    {run 'tmux select-layout "#{@layout_save}" ; set -up @layout_save'} \
    {set -Fp @layout_save "#{window_layout}" ; run 'tmux resize-pane -y 100%'}

# Alt+x: Toggle horizontal maximize/restore for the current pane
# If layout is saved, restore it; otherwise save current layout and maximize horizontally
bind -n M-x if -F '#{@layout_save}' \
    {run 'tmux select-layout "#{@layout_save}" ; set -up @layout_save'} \
    {set -Fp @layout_save "#{window_layout}" ; run 'tmux resize-pane -x 100%'}
